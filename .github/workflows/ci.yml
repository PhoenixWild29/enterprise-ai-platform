name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python eval_harness.py --json eval_report.json

  # Runs only when the repository has an ANTHROPIC_API_KEY secret and the
  # JUDGE_MODEL / AGENT_MODEL variables. Informational until its scores are baselined.
  llm-eval:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      JUDGE_MODEL: ${{ vars.JUDGE_MODEL }}
      AGENT_MODEL: ${{ vars.AGENT_MODEL }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ env.ANTHROPIC_API_KEY != '' && env.JUDGE_MODEL != '' && env.AGENT_MODEL != '' }}
      - uses: actions/setup-python@v5
        if: ${{ env.ANTHROPIC_API_KEY != '' && env.JUDGE_MODEL != '' && env.AGENT_MODEL != '' }}
        with:
          python-version: "3.12"
      - if: ${{ env.ANTHROPIC_API_KEY != '' && env.JUDGE_MODEL != '' && env.AGENT_MODEL != '' }}
        run: |
          pip install -r requirements.txt anthropic
          python eval_harness.py --tier 2 --judge llm --agents llm --json llm_eval_report.json
